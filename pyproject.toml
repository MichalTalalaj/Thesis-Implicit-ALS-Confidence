[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-confidence-thesis"
version = "0.1.0"
description = "Research code for confidence functions in Steam implicit ALS"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "implicit"]

[tool.setuptools.packages.find]
where = ["src"]
